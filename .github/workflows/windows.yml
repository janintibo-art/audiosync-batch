name: Construire AudioSync Batch Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install pyinstaller
      - name: Construire EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AudioSync-Batch app.py
      - name: Publier EXE
        uses: actions/upload-artifact@v4
        with:
          name: AudioSync-Batch-Windows-v4
          path: dist/AudioSync-Batch.exe
